<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spin Drill — 15bb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c0c0e; --surface: #141416; --surface-2: #1c1c20;
      --fg: #f3f3f4; --muted: #9a9aa3; --subtle: #6e6e76; --border: #2a2a30;
      --raise: #f03c3c; --allin: #7d1f1f; --fold: #3d7cb8; --call: #2f9e73;
      --ok: #3dba7c; --bad: #e25555; --card: #f7f4ee; --ink: #161616; --heart: #c43b3b;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: "IBM Plex Sans", system-ui, sans-serif; overflow-x: hidden; }
    button { font-family: inherit; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    header { border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .brand { margin-right: auto; }
    .brand small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .18em; color: var(--subtle); text-transform: uppercase; }
    h1 { margin: 0; font-size: 20px; font-weight: 500; }
    h1 span { font-family: "IBM Plex Mono", monospace; font-size: 14px; color: var(--muted); margin-left: 8px; }
    nav { display: flex; background: var(--surface); border-radius: 8px; padding: 4px; }
    nav button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 6px; font-size: 14px; }
    nav button.active { background: var(--surface-2); color: var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    .row { display: grid; gap: 20px; }
    .row[hidden], [hidden] { display: none !important; }
    @media (min-width: 900px) {
      .row.strategy, .row.stats { grid-template-columns: 1fr 260px; }
      .row.practice { grid-template-columns: 1fr minmax(22rem, 26rem); }
    }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .grid-wrap { width: 100%; overflow-x: auto; }
    .grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 1px; background: var(--bg); min-width: 0; }
    .cell { position: relative; aspect-ratio: 1; overflow: hidden; border: 0; padding: 0; text-align: left; }
    .cell.active { outline: 2px solid var(--fg); outline-offset: 1px; z-index: 2; }
    .bars { position: absolute; inset: 0; display: flex; }
    .bars > i { display: block; height: 100%; }
    .cell label { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 3px; font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px #0008; }
    .acc { font-size: 10px; align-self: flex-end; }
    .pos { border: 2px solid #3dba7c; border-radius: 8px; background: var(--surface-2); padding: 12px; margin-bottom: 16px; }
    .pos ul { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
    .pos li { margin: 6px 0; }
    .mix-row { margin: 8px 0; }
    .mix-row .top { display: flex; justify-content: space-between; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    .track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
    .track > i { display: block; height: 100%; }
    .cards { display: flex; justify-content: center; gap: 12px; margin: 16px 0; }
    .pcard { width: 112px; height: 156px; background: var(--card); color: var(--ink); border-radius: 10px; position: relative; box-shadow: 0 18px 40px #0007; }
    .pcard.empty { background: var(--surface-2); }
    .pcard .c { position: absolute; top: 8px; left: 8px; font-family: "IBM Plex Mono", monospace; font-weight: 600; line-height: 1; }
    .pcard .pip { width: 54px; height: 54px; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .actions { display: grid; gap: 8px; }
    .actions.n3 { grid-template-columns: 1fr 1fr 1fr; }
    .actions.n2 { grid-template-columns: 1fr 1fr; }
    .actions.n4 { grid-template-columns: 1fr 1fr; }
    .actions button { border: 0; color: #fff; border-radius: 10px; padding: 14px 8px; font-weight: 600; font-size: 13px; }
    .b-fold { background: var(--fold); } .b-raise { background: var(--raise); }
    .b-allin { background: var(--allin); } .b-call { background: var(--call); }
    .fb { text-align: center; font-size: 18px; font-weight: 500; min-height: 28px; }
    .fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); } .fb.mix { color: var(--fg); }
    .muted { color: var(--muted); font-size: 13px; }
    .ghost { background: transparent; border: 0; color: var(--muted); padding: 8px; width: 100%; }
    .danger { background: #e2555522; color: var(--bad); border: 0; border-radius: 8px; padding: 8px 12px; }
    .head-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    kbd { font-size: 10px; opacity: .7; margin-left: 4px; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pills button { border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
    .pills button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <small>Spin &amp; Go · 3-max · 15bb</small>
      <h1>Spin Drill<span id="hdr-spot">BTN open</span></h1>
    </div>
    <nav>
      <button data-tab="practice">Тренировка</button>
      <button data-tab="strategy" class="active">Стратегия</button>
      <button data-tab="stats">Статистика</button>
    </nav>
  </header>
  <main>
    <section id="view-strategy" class="row strategy"></section>
    <section id="view-practice" class="row practice" hidden></section>
    <section id="view-stats" class="row stats" hidden></section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
